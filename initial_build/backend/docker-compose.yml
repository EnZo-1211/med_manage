version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: meduser
      POSTGRES_PASSWORD: medpassword
      POSTGRES_DB: medmanage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    environment:
      DATABASE_URL: postgresql://meduser:medpassword@db/medmanage
    depends_on:
      - db

volumes:
  postgres_data:
